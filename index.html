<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>感觉尺 · 森林之旅</title>
<style>
  html,body{margin:0;height:100%;background:#e6ede0;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:#4a5340;font-size:15px;letter-spacing:1px;pointer-events:none;
    transition:opacity .3s;white-space:nowrap;text-align:center;max-width:92vw;
    text-shadow:0 1px 3px rgba(255,255,255,0.8);}
  #topbar{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
  #topbar button{font:600 13px/1 -apple-system,"PingFang SC",sans-serif;
    padding:9px 12px;border:0;border-radius:999px;background:rgba(255,255,255,.82);
    color:#3a3a30;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  #panel{position:fixed;inset:0;background:rgba(20,24,18,.55);display:none;
    z-index:6;align-items:center;justify-content:center;padding:16px}
  #panel .box{background:#f4f7ef;border-radius:14px;padding:16px;max-width:520px;width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,.28)}
  #panel h3{margin:0 0 4px;font-size:16px;color:#3a3a30}
  #panel .sub{color:#6b7260;font-size:12px;margin-bottom:12px}
  #panel .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  #panel .lv{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid #cfd8c6;
    background:#fff;cursor:pointer;font-size:13px;color:#3a3a30}
  #panel .lv .t{font-weight:700;display:block}
  #panel .lv .c{color:#7c8470;font-size:11px}
  #panel .lv[disabled]{opacity:.45;cursor:not-allowed}
  #panel .acts{margin-top:12px;display:flex;gap:8px}
  #panel .acts button{flex:1;padding:10px;border:0;border-radius:10px;cursor:pointer;
    font-weight:700;background:#8aa87a;color:#fff}
  #panel .acts button.ghost{background:#dfe5d8;color:#3a3a30}
  @media (max-width:520px){ #hint{font-size:13px;bottom:18px} #topbar button{padding:8px 10px;font-size:12px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="topbar">
  <button id="btnLevels">关卡</button>
  <button id="btnData">数据</button>
</div>
<div id="panel"><div class="box">
  <h3 id="pTitle">关卡</h3>
  <div class="sub" id="pSub"></div>
  <div class="grid" id="pGrid"></div>
  <div class="acts">
    <button id="pClose" class="ghost">关闭</button>
    <button id="pReset">清空进度</button>
  </div>
</div></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hint');

const VIEW_W = 960, VIEW_H = 540;
const GROUND_Y = 440;
const WORLD_W = 4200;

let W, H, DPR, scale = 1, offsetX = 0, offsetY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  scale = Math.min(W / VIEW_W, H / VIEW_H);
  offsetX = (W - VIEW_W * scale) / 2;
  offsetY = (H - VIEW_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ===== 形状类型系统（T2）：每个形状 = judge(判定标量) + band(容差) + snap(表现) + renderShape + ghost =====
// 所有容差均为 [PLACEHOLDER · 待 σp 实测验证]
// ===== §2 统一调色板（V1/V2 落地：替换散落硬编码 hex）=====
const PAL = {
  skyTop:'#eef3e8', skyBot:'#dce6d2',                                   // 天空雾绿（远→近）
  treeFar:'#cdd8c6', treeMid:'#a9bfa2', treeNear:'#86a07e',             // 远/中/近树剪影
  ground:'#b8a98f', groundTop:'#c9bca0',                                // 地面暖土带 + 顶边高光
  pit:'#3f3a33',                                                        // 坑/深渊（负空间）
  obstacle:'#3a352c', obstacleTop:'#4a4438',                            // 障碍/立柱/桩 + 顶面受光
  wall:'#8a8578', doorWarm1:'#fff8d2', doorWarm2:'#ffebaa',            // 门墙 + 暖光门（保留既有渐变调性）
  bush:'#7f9a74', water:'#5f88a8', ringRGB:'140,165,120',               // 灌木 / 水 / 圈环(rgb)
};
const ROPE_C = '#e2712c', ROPE_H = '#f0a85c';   // V2 提对比（全画面唯一暖焦点，主理人锁定）
const ROPE_SHADOW = 'rgba(40,25,10,0.18)';        // V2 绳柔和投影层（偏移 2,2）
const GHOST_C = '#4a90c2';                        // V2 鬼影冷蓝（实色 + alpha）
const CUE_C = '#f2c14e';                          // V2 场景 cue 暖琥珀（与鬼影严格色相分离）

function strokeShape(pts, alpha, closeIt) {   // V2：主描边加宽 + 提对比 + 柔和投影层（仅特效，几何点集不变）
  if (alpha <= 0 || pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const doPath = (dx, dy) => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + dx, pts[0][1] + dy);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] + dx, pts[i][1] + dy);
    if (closeIt) ctx.closePath();
  };
  ctx.strokeStyle = ROPE_SHADOW; ctx.lineWidth = 12; doPath(2, 2); ctx.stroke();     // 柔和投影层（偏移 2,2）
  ctx.strokeStyle = ROPE_C; ctx.lineWidth = 9; doPath(0, 0); ctx.stroke();            // 主描边（唯一暖焦点）
  ctx.strokeStyle = ROPE_H; ctx.lineWidth = 2.5; doPath(-1.2, -1.2); ctx.stroke();   // 高光
  ctx.restore();
}
function ghostShape(pts, closeIt) {   // 正确形状鬼影（P2：只给相对/位置，绝不显示数值/刻度）
  if (pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = GHOST_C;
  ctx.lineWidth = 5; ctx.setLineDash([10, 8]); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (closeIt) ctx.closePath();
  ctx.stroke();
  // 端点接触标记（P3：接触点=折点/闭合顶点）— 小实心圆 r=3，无数值
  ctx.setLineDash([]);
  ctx.fillStyle = GHOST_C;
  const marks = closeIt ? pts : [pts[0], pts[pts.length - 1]];
  for (const p of marks) { ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function cueShape(pts, closeIt, alpha) { // V2 场景目标提示（暖琥珀，与鬼影冷蓝严格色相分离；呼吸 0.4–0.9）
  if (pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = CUE_C;
  ctx.lineWidth = 4; ctx.setLineDash([8, 7]); ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (closeIt) ctx.closePath();
  ctx.stroke();
  ctx.restore();
}
// 圆角矩形路径（柱/桩/横梁/土丘剪影，V1 有机化）— 仅构建路径，调用方自行 fill/stroke
function barShape(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// L3 场景 flavor（V1 去公式后降级：轻灰 11px、非必要通道）
function drawFlavor(text, x, y) {
  ctx.save();
  ctx.fillStyle = 'rgba(70,60,45,0.5)';
  ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function ellipsePts(cx, cy, rx, ry, n) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return p;
}
function rectPts(cx, cy, A) { const h = A / 2; return [[cx-h,cy-h],[cx+h,cy-h],[cx+h,cy+h],[cx-h,cy+h]]; }
function triPts(cx, baseY, a) {
  const h = a * Math.sqrt(3) / 2;
  return [[cx - a/2, baseY], [cx + a/2, baseY], [cx, baseY - h]];
}
// 已知弦长 C 与弧长 L，求圆段半径/矢高（二分求解 θ/sinθ = L/C）
function arcSeg(C, L) {
  const target = L / C;
  if (!(target > 1.0005)) return { R: C / 2 / 1e-4, sag: 0, th: 1e-4 };
  let lo = 1e-4, hi = Math.PI / 2 - 1e-4;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (mid / Math.sin(mid) < target) lo = mid; else hi = mid;
  }
  const th = (lo + hi) / 2, R = C / (2 * Math.sin(th));
  return { R, sag: R * (1 - Math.cos(th)), th };
}
function arcPts(cxL, cxR, baseY, L, n) {
  const C = cxR - cxL;
  if (L <= C * 1.002) return [[cxL, baseY], [cxR, baseY]];
  const seg = arcSeg(C, L);
  const cx = (cxL + cxR) / 2, cy = baseY + seg.R * Math.cos(seg.th);
  const a0 = -(Math.PI / 2 + seg.th), a1 = seg.th - Math.PI / 2;
  const p = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * (i / n); p.push([cx + Math.cos(a) * seg.R, cy + Math.sin(a) * seg.R]); }
  return p;
}
// 不规则闭合：固定形状模板（比例与角度写死，方案X），按周长缩放
const POLY_TPL = [[-40,0],[30,0],[52,-34],[-18,-46]];
let POLY_BASE = 0;
(function(){ for (let i=0;i<POLY_TPL.length;i++){ const a=POLY_TPL[i], b=POLY_TPL[(i+1)%POLY_TPL.length]; POLY_BASE += Math.hypot(b[0]-a[0], b[1]-a[1]); } })();
function polyPts(cx, baseY, perim) {
  const s = perim / POLY_BASE;
  return POLY_TPL.map(p => [cx + p[0] * s, baseY + p[1] * s]);
}

// ===== 关卡（按跨类序：朝向 → 折线 → 曲线 → 闭合）=====
const LEVELS = [
  {
    id:'gap', cls:'朝向', name:'横桥', shape:'line',
    triggerX:500, handX:512, handY:GROUND_Y-40,
    initLen:40, maxLen:300, growSpeed:110,
    gapX1:522, gapX2:682, exitX:800, introDuration:2.0,
    judge:(len)=>len, band:[166,222],           // [PLACEHOLDER]
    snap:(len)=>len,
    introText:'路断了。画一根桥，搭过去吧。',
    hintReady:'按住屏幕，让绳子从手中生长', hintFixed:'点击屏幕，把绳子放倒',
    failShort:'短了一截…', failShortHint:'从手里放下来，长度会短一截',
    failLong:'太长了，桥头翘起来…', failLongHint:'太长了，桥头搭不住',
    renderShape(lenEff, alpha, offY, t){
      if (t != null && t < 1) {                 // 放倒动画（保持原观感）
        const sy = this.handY + (GROUND_Y - this.handY) * t;
        const ang = -Math.PI/2 + (Math.PI/2) * t;
        return strokeShape([[this.handX, sy + offY],
          [this.handX + Math.cos(ang) * ropeLen, sy + Math.sin(ang) * ropeLen + offY]], alpha, false);
      }
      strokeShape([[this.handX, GROUND_Y + offY], [this.handX + lenEff, GROUND_Y + offY]], alpha, false);
    },
    ghost(){ ghostShape([[this.handX, GROUND_Y], [this.gapX2, GROUND_Y]], false); },
    scene(isCur, ba){
      // 深渊（负空间）：统一暗色调，去除碎边
      ctx.fillStyle = PAL.pit;
      ctx.fillRect(this.gapX1, GROUND_Y, this.gapX2 - this.gapX1, VIEW_H - GROUND_Y + 60);
      // 两侧崖顶接触点（圆角岩台 + 顶面受光）— P3 锐利可读
      for (const gx of [this.gapX1, this.gapX2]) {
        ctx.fillStyle = PAL.obstacle; barShape(gx - 6, GROUND_Y - 5, 12, 16, 4); ctx.fill();
        ctx.fillStyle = PAL.obstacleTop; ctx.fillRect(gx - 6, GROUND_Y - 5, 12, 3);
      }
      if (isCur) cueShape([[this.gapX2, GROUND_Y - 12], [this.gapX2, GROUND_Y + 14]], false, ba);
    },
  },
  {
    id:'fold', cls:'折线', name:'对折双股', shape:'fold',
    triggerX:950, handX:962, handY:GROUND_Y-50,
    initLen:40, maxLen:420, growSpeed:110,
    anchorX:1012, topY:GROUND_Y-96, gapW:150, exitX:1250, introDuration:2.0,
    judge:(len)=>len/2,                          // 有效跨度 = 总长/2
    band:[132,168],                              // 跨度容差 [PLACEHOLDER]（±12%）
    snap:()=>300,                                // 表现 snap 到正好跨过（判定宽松、画面正确）
    introText:'桥面松了。把绳子对折成双股，撑过去。',
    hintReady:'按住屏幕，让绳子从手中生长', hintFixed:'点击屏幕，把绳子对折成双股',
    failShort:'双股太短，够不到…', failShortHint:'对折后只剩一半长，往长了给',
    failLong:'太长了，双股松垮…', failLongHint:'对折后超出太多，松了',
    renderShape(lenEff, alpha, offY){
      const span = lenEff / 2, y = this.topY + offY, x = this.anchorX;
      strokeShape([[x, y - 7], [x + span, y - 7]], alpha, false);
      strokeShape([[x, y + 7], [x + span, y + 7]], alpha, false);
    },
    ghost(){ const y = this.topY, x = this.anchorX;
      ghostShape([[x, y - 7], [x + this.gapW, y - 7]], false);
      ghostShape([[x, y + 7], [x + this.gapW, y + 7]], false); },
    scene(isCur, ba){
      // 两个接触点（立柱）→ 折叠自明；虚线为目标跨度
      const x0 = this.anchorX, x1 = this.anchorX + this.gapW, top = this.topY;
      // 横梁（连接两柱，顶面受光）
      ctx.fillStyle = PAL.obstacle; barShape(x0 - 12, top - 12, (x1 - x0) + 24, 14, 4); ctx.fill();
      ctx.fillStyle = PAL.obstacleTop; ctx.fillRect(x0 - 12, top - 12, (x1 - x0) + 24, 3);
      // 两根立柱（圆角柱 + 顶面受光）
      for (const px of [x0, x1]) {
        ctx.fillStyle = PAL.obstacle; barShape(px - 7, top, 14, GROUND_Y - top, 5); ctx.fill();
        ctx.fillStyle = PAL.obstacleTop; ctx.fillRect(px - 7, top, 14, 4);
      }
      if (isCur) cueShape([[x0, top], [x1, top]], false, ba);
      drawFlavor('对折', x0 + (x1 - x0) / 2, top - 18);
    },
  },
  {
    id:'lbrace', cls:'折线', name:'L 型顶撑', shape:'lbrace',
    triggerX:1400, handX:1412, handY:GROUND_Y-60,
    initLen:40, maxLen:320, growSpeed:110,
    baseX:1462, armReq:90, platY:GROUND_Y-90, exitX:1700, introDuration:2.0,
    judge:(len)=>len/2,                          // 等臂：单臂长
    band:[78,102],                               // [PLACEHOLDER]（±13%）
    snap:()=>180,
    introText:'石头快塌了。折成直角，顶住它。',
    hintReady:'按住屏幕，让绳子从手中生长', hintFixed:'点击屏幕，把绳子折成直角',
    failShort:'太短，顶不到…', failShortHint:'竖向和横向都要够，两段加起来',
    failLong:'太长，撑歪了…', failLongHint:'臂太长，顶歪了',
    renderShape(lenEff, alpha, offY){
      const a = lenEff / 2, x = this.baseX;
      strokeShape([[x, GROUND_Y + offY], [x, GROUND_Y - a + offY], [x + a, GROUND_Y - a + offY]], alpha, false);
    },
    ghost(){ const a = this.armReq, x = this.baseX;
      ghostShape([[x, GROUND_Y], [x, GROUND_Y - a], [x + a, GROUND_Y - a]], false); },
    scene(isCur, ba){
      // 接触点：地面 + 转角柱 + 平台底面（夹角≠直线 → 拐角自明）
      const bx = this.baseX, py = this.platY, arm = this.armReq;
      // 悬石平台（横梁）：圆角 + 顶面受光，保留轻微摇曳
      ctx.save();
      const wob = Math.sin(performance.now() / 260) * 0.02;
      ctx.translate(bx + 150, py - 8); ctx.rotate(wob);
      ctx.fillStyle = PAL.obstacle; barShape(-150, -14, 300, 14, 5); ctx.fill();
      ctx.fillStyle = PAL.obstacleTop; ctx.fillRect(-150, -14, 300, 4);
      ctx.restore();
      // 转角接触柱（圆头小柱 + 顶面受光）
      ctx.fillStyle = PAL.obstacle; barShape(bx - 6, py - 2, 12, 12, 4); ctx.fill();
      ctx.fillStyle = PAL.obstacleTop; ctx.fillRect(bx - 6, py - 2, 12, 3);
      if (isCur) cueShape([[bx, GROUND_Y], [bx, py], [bx + arm, py]], false, ba);
      drawFlavor('两段：竖横', bx + arm / 2, py - 22);
    },
  },
  {
    id:'arch', cls:'曲线', name:'拱', shape:'arch',
    triggerX:1850, handX:1862, handY:GROUND_Y-70,
    initLen:40, maxLen:340, growSpeed:110,
    bankL:1912, chord:160, arcReq:216, exitX:2150, introDuration:2.0,
    judge:(len)=>len,                            // 判定标量 = 弧长本体
    band:[183.6,243.8],                          // [PLACEHOLDER]（上界钉在略低于 πC/2≈251）
    snap:()=>216,
    introText:'小溪挡路。把绳子弯成拱，跨过去。',
    hintReady:'按住屏幕，让绳子从手中生长', hintFixed:'点击屏幕，把绳子弯成拱',
    failShort:'弧太短，塌下去了…', failShortHint:'沿曲线的长度比两岸直线距离长',
    failLong:'弧太长，撑不住…', failLongHint:'拱得过头了',
    renderShape(lenEff, alpha, offY){
      strokeShape(arcPts(this.bankL, this.bankL + this.chord, GROUND_Y + offY, lenEff, 26), alpha, false);
    },
    ghost(){ ghostShape(arcPts(this.bankL, this.bankL + this.chord, GROUND_Y, this.arcReq, 26), false); },
    scene(isCur, ba){
      const R = this.bankL + this.chord;
      ctx.fillStyle = PAL.water;                                  // 水（物理必然：直线会垂进水里）
      ctx.fillRect(this.bankL, GROUND_Y + 4, this.chord, 26);
      // 两岸（圆角土丘剪影 + 顶面受光 = 拱的落点接触点）
      ctx.fillStyle = PAL.ground;
      for (const bx0 of [this.bankL - 46, R]) { barShape(bx0, GROUND_Y - 4, 46, VIEW_H - GROUND_Y + 60, 6); ctx.fill(); }
      ctx.fillStyle = PAL.obstacleTop;
      ctx.fillRect(this.bankL - 46, GROUND_Y - 4, 46, 3);
      ctx.fillRect(R, GROUND_Y - 4, 46, 3);
      if (isCur) cueShape(arcPts(this.bankL, R, GROUND_Y, this.arcReq, 26), false, ba);
      drawFlavor('弧比两岸直线长', (this.bankL + R) / 2, GROUND_Y + 48);
    },
  },
  {
    id:'circle', cls:'闭合', name:'圆围栏', shape:'circle',
    triggerX:2300, handX:2312, handY:GROUND_Y-70,
    initLen:40, maxLen:400, growSpeed:110,
    targetCx:2440, targetR:45, exitX:2600, introDuration:2.2,
    judge:(len)=>len/(2*Math.PI), band:[39.6,50.4],   // [PLACEHOLDER]
    snap:(len)=>len,
    introText:'画个圈，把小兔子围起来吧。',
    hintReady:'按住屏幕，让绳子从手中生长', hintFixed:'点击屏幕，把绳子弯成圆围栏',
    failShort:'圆太小，老虎扑进来了…', failShortHint:'围栏太小，小兔子露出来了',
    failLong:'圆太大，老虎绕过去了…', failLongHint:'围栏太大，太松了',
    renderShape(lenEff, alpha, offY){
      const r = lenEff / (2 * Math.PI);
      strokeShape(ellipsePts(this.targetCx, GROUND_Y + offY, r, r * 0.38, 44), alpha, true);
    },

// ===== 状态 =====
let phase = 'intro';
let phaseTimer = 0, charX = 120, charAlpha = 1, cameraX = 0;
let levelIndex = -1, currentLevel = null, ropeLen = 0, failMsg = '';
let transformT = 0, successT = 0, successWalkStarted = false;
let walkTargetX = null, walkOnArrive = null, completedShapes = [];
let textTimer = 0, blinkTimer = 0, enterT = 0, fadeT = 0, endingT = 0;
let tigerX = 0, tigerBaseX = 0, tigerTimer = 0, tigerState = 'stalking', rabbitScared = false;
let shakeT = 0;                       // T9 屏震
let levelStartWall = 0;               // T8 单关计时

// ===== 进度存档（T10）=====
const SAVE_KEY = 'sr_progress_v1';
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || null; } catch(e){ return null; }
}
function saveProgress(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      levelIndex: Math.max(0, levelIndex + 1),
      completed: completedShapes.map(s => s.level.id),
      ts: Date.now(),
    }));
  } catch(e){}
}
function clearProgress(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }
function rebuildCompleted(uptoIdx){
  completedShapes = [];
  for (let i = 0; i < uptoIdx && i < LEVELS.length; i++) {
    const L = LEVELS[i];
    completedShapes.push({ level: L, len: L.snap(L.band ? (L.band[0] + L.band[1]) / 2 * (L.judge ? 1 : 1) : 0) });
  }
}

// ===== playtest 仪表（T8）=====
const metrics = {};
function metricFor(L){
  return metrics[L.id] || (metrics[L.id] = { id:L.id, cls:L.cls, name:L.name,
    attempts:0, passes:0, fails:0, consec:0, maxConsec:0, firstTryPass:null, durations:[] });
}
function report(){
  const rows = Object.keys(metrics).map(k => {
    const m = metrics[k];
    return { id:m.id, cls:m.cls, name:m.name, attempts:m.attempts, passes:m.passes,
      passRate: m.attempts ? +(m.passes / m.attempts).toFixed(2) : null,
      maxConsec:m.maxConsec, firstTryPass:m.firstTryPass,
      avgSec: m.durations.length ? +(m.durations.reduce((a,b)=>a+b,0)/m.durations.length).toFixed(1) : null };
  });
  const A = rows.filter(r => r.maxConsec >= 3);                       // A：连续3次失败仍不懂
  const B = rows.filter(r => r.id === LEVELS[0].id && r.passRate !== null && r.passRate > 0.9); // B：首关无挑战
  const C = rows.filter(r => r.id === LEVELS[LEVELS.length-1].id && r.attempts >= 3 && r.passRate < 0.4); // C：终关劝退
  return { rows, signals:{
    A_feedbackBroken: A.length > 0, B_tooEasy: B.length > 0, C_tooHard: C.length > 0 },
    sigmaP_note: '容差为 [PLACEHOLDER·待 σp 实测验证]，实机数据可反向校准' };
}
function exportJson(){
  const blob = new Blob([JSON.stringify(report(), null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'sense_ruler_playtest.json'; a.click(); URL.revokeObjectURL(a.href);
}

// ===== 音效 / 触感（T9）=====
let actx = null;
function tone(freq, dur, type, gain){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime);
    g.gain.linearRampToValueAtTime(gain || 0.12, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.05);
  } catch(e){}
}
function sfxSuccess(){ tone(660, 0.16, 'sine', 0.10); setTimeout(()=>tone(880, 0.22, 'sine', 0.09), 110); }
function sfxFail(){ tone(150, 0.18, 'sawtooth', 0.10); }
function haptic(pattern){ try { navigator.vibrate && navigator.vibrate(pattern); } catch(e){} }

function setHint(t){ const v = t || ''; if (hintEl.textContent !== v) hintEl.textContent = v; hintEl.style.opacity = v ? '1' : '0'; }
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
function updateCamera(dt){ const target = Math.max(0, Math.min(WORLD_W - VIEW_W, charX - 300)); cameraX += (target - cameraX) * Math.min(1, dt * 5); }
function startWalking(targetX, onArrive){ walkTargetX = targetX; walkOnArrive = onArrive; phase = 'walking'; }

function startLevel(i){
  levelIndex = i; currentLevel = LEVELS[i];
  setHint(''); textTimer = 0; blinkTimer = 0;
  successWalkStarted = false; failMsg = ''; shakeT = 0;
  if (currentLevel.id === 'circle') { tigerBaseX = currentLevel.targetCx + 180; tigerX = tigerBaseX; tigerState = 'stalking'; tigerTimer = 0; rabbitScared = true; }
  startWalking(currentLevel.triggerX, () => { phase = 'level_intro'; phaseTimer = 0; });
}
function startEnding(){ startWalking(WORLD_W - 400, () => { phase = 'done'; phaseTimer = 0; setHint(''); console.log('[SenseRuler] playtest report', report()); }); }
function resetGame(keepSave){
  phase = 'intro'; phaseTimer = 0; charX = 120; charAlpha = 1; cameraX = 0;
  levelIndex = -1; currentLevel = null; ropeLen = 0; failMsg = '';
  transformT = 0; successT = 0; successWalkStarted = false;
  walkTargetX = null; walkOnArrive = null; completedShapes = [];
  textTimer = 0; blinkTimer = 0; enterT = 0; fadeT = 0; endingT = 0; shakeT = 0;
  tigerState = 'stalking'; tigerTimer = 0;
  if (!keepSave) clearProgress();
  setHint('');
}

// ===== 输入 =====
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (phase === 'ending' || phase === 'done') { resetGame(true); return; }
  if (phase === 'ready') { phase = 'growing'; setHint(''); }
  else if (phase === 'fixed') { phase = 'transforming'; transformT = 0; setHint(''); }
});
function release(){ if (phase === 'growing') { phase = 'fixed'; setHint(currentLevel.hintFixed); } }
canvas.addEventListener('pointerup', e => { e.preventDefault(); release(); });
canvas.addEventListener('pointercancel', e => { e.preventDefault(); release(); });
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') release(); });

// ===== 判定（统一走 judge/band）=====
function evaluate(){
  const L = currentLevel, m = metricFor(L);
  m.attempts++;
  const eff = L.judge(ropeLen);
  if (eff < L.band[0]) return onFail(L.failShort, L.failShortHint);
  if (eff > L.band[1]) return onFail(L.failLong, L.failLongHint);
  return onSuccess();
}
function onSuccess(){
  const L = currentLevel, m = metricFor(L);
  m.passes++; m.consec = 0;
  if (m.attempts === 1) m.firstTryPass = true;
  m.durations.push((performance.now() - levelStartWall) / 1000);
  completedShapes.push({ level: L, len: L.snap(ropeLen) });   // P5：表现 snap 到理想形状
  saveProgress();                                            // T10：进度落盘
  phase = 'success'; successT = 0; successWalkStarted = false;
  setHint(''); sfxSuccess(); haptic(28);
  if (L.id === 'circle') { tigerState = 'repelled'; tigerTimer = 0; }
}
function onFail(msg, hint){
  const L = currentLevel, m = metricFor(L);
  m.fails++; m.consec++; m.maxConsec = Math.max(m.maxConsec, m.consec);
  phase = 'fail'; phaseTimer = 0; failMsg = msg; setHint(hint);
  shakeT = 0.28; sfxFail(); haptic(60);                       // T9：屏震 + 音效 + 触感
  if (L.id === 'circle') { tigerState = 'pouncing'; tigerTimer = 0; rabbitScared = true; }
}

// ===== 更新 =====
let last = performance.now();
function update(now){
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  updateCamera(dt);
  const activeLevelPhases = ['level_intro','ready','growing','fixed','transforming','success','fail','entering'];
  if (currentLevel && activeLevelPhases.includes(phase)) { textTimer += dt; blinkTimer += dt; }
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  updateTiger(dt);

  if (phase === 'intro'){ phaseTimer += dt; if (phaseTimer > 1.6) { const p = loadProgress(); if (p && p.levelIndex > 0 && p.levelIndex < LEVELS.length) { rebuildCompleted(p.levelIndex); startLevel(p.levelIndex); } else startLevel(0); } return; }
  if (phase === 'walking'){
    if (walkTargetX !== null && charX < walkTargetX){
      charX = Math.min(walkTargetX, charX + 200 * dt);
      if (charX >= walkTargetX){ const cb = walkOnArrive; walkOnArrive = null; walkTargetX = null; if (cb) cb(); }
    } return;
  }
  if (phase === 'level_intro'){
    phaseTimer += dt;
    if (phaseTimer >= currentLevel.introDuration){ ropeLen = currentLevel.initLen; phase = 'ready'; setHint(currentLevel.hintReady); levelStartWall = performance.now(); }
    return;
  }
  if (phase === 'growing'){ ropeLen = Math.min(currentLevel.maxLen, ropeLen + currentLevel.growSpeed * dt); return; }
  if (phase === 'transforming'){ transformT += dt / 0.45; if (transformT >= 1){ transformT = 1; evaluate(); } return; }
  if (phase === 'success'){
    successT += dt;
    if (!successWalkStarted && successT > 0.6){
      successWalkStarted = true;
      if (currentLevel.finale){ startWalking(currentLevel.doorX - 18, () => { phase = 'entering'; enterT = 0; }); }
      else startWalking(currentLevel.exitX, () => { if (levelIndex + 1 < LEVELS.length) startLevel(levelIndex + 1); else startEnding(); });
    } return;
  }
  if (phase === 'entering'){
    enterT += dt / 0.8;
    const t = easeInOutCubic(Math.min(enterT, 1));
    charX = (currentLevel.doorX - 18) + (currentLevel.doorS / 2 + 18) * t;
    charAlpha = 1 - t;
    if (enterT >= 1){ charAlpha = 0; phase = 'fadeout'; fadeT = 0; }
    return;
  }
  if (phase === 'fadeout'){ fadeT += dt / 0.8; if (fadeT >= 1){ phase = 'ending'; endingT = 0; setHint(''); clearProgress(); } return; }
  if (phase === 'ending'){ endingT += dt; return; }
  if (phase === 'done') return;
  if (phase === 'fail'){
    phaseTimer += dt;
    if (phaseTimer > 1.5){                        // T9：重试零成本（≤1.5s，且不重播过场）
      ropeLen = currentLevel.initLen; failMsg = ''; phase = 'ready';
      setHint(currentLevel.hintReady); levelStartWall = performance.now();
      if (currentLevel.id === 'circle'){ tigerState = 'stalking'; tigerTimer = 0; }
    } return;
  }
}
function updateTiger(dt){
  if (!currentLevel || currentLevel.id !== 'circle') return;
  tigerTimer += dt;
  if (tigerState === 'stalking') tigerX = tigerBaseX + Math.sin(tigerTimer * 1.2) * 15;
  else if (tigerState === 'pouncing') { const t = Math.min(tigerTimer / 0.35, 1); tigerX = tigerBaseX - 140 * easeOutCubic(t); }
  else if (tigerState === 'repelled') { const t = Math.min(tigerTimer / 0.5, 1); tigerX = tigerBaseX + 50 * t; }
}

// ===== 绘制 =====
function getBlinkAlpha(){ if (blinkTimer < 1.5) return 0.4 + 0.5 * (0.5 + 0.5 * Math.sin(blinkTimer * Math.PI * 8 / 3 - Math.PI / 2)); return 0.65; }

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(offsetX, offsetY); ctx.scale(scale, scale);
  if (shakeT > 0){ const a = shakeT * 14; ctx.translate((Math.random()-0.5)*a, (Math.random()-0.5)*a); }

  if (phase === 'ending'){ drawEnding(); ctx.restore(); return; }
  drawSky();
  drawTrees(0.25, PAL.treeFar, 150, 100, 11);
  drawTrees(0.5, PAL.treeMid, 190, 130, 23);
  drawTrees(0.8, PAL.treeNear, 240, 160, 37);
  ctx.save(); ctx.translate(-cameraX, 0);
  drawGround(); drawLevelElements(); drawRopeShape(); drawCharacter();
  ctx.restore();
  drawLevelText(); drawMessage();
  if (phase === 'fadeout'){ ctx.fillStyle = `rgba(20,18,15,${Math.min(fadeT,1)})`; ctx.fillRect(0,0,VIEW_W,VIEW_H); }
  ctx.restore();
}
function drawSky(){ const g = ctx.createLinearGradient(0,0,0,GROUND_Y); g.addColorStop(0,PAL.skyTop); g.addColorStop(1,PAL.skyBot); ctx.fillStyle = g; ctx.fillRect(0,0,VIEW_W,GROUND_Y); }
function drawTrees(parallax, color, spacing, baseH, seed){
  const offset = cameraX * parallax;
  const startI = Math.floor(offset / spacing) - 1, endI = Math.ceil((offset + VIEW_W) / spacing) + 1;
  ctx.fillStyle = color;
  for (let i = startI; i <= endI; i++){
    const wx = i * spacing + ((i * 73 + seed) % 70) - 35;
    drawTreeShape(wx - offset, GROUND_Y, baseH + ((i * 137 + seed) % 60) - 30);
  }
}
function drawTreeShape(x, baseY, h){   // V1：多瓣叠加有机冠形（非单圆）
  const trunkW = Math.max(4, h * 0.07);
  ctx.fillRect(x - trunkW/2, baseY - h*0.42, trunkW, h*0.42);
  const cy = baseY - h*0.42 - h*0.25, r = h*0.3;
  ctx.beginPath(); ctx.arc(x, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x - r*0.8, cy + r*0.30, r*0.62, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r*0.8, cy + r*0.25, r*0.66, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r*0.1, cy - r*0.55, r*0.55, 0, Math.PI*2); ctx.fill();
}
function drawGround(){   // V1：单一暖土色带 + 顶边高光，去碎块
  const startX = cameraX - 60, endX = cameraX + VIEW_W + 60;
  ctx.fillStyle = PAL.ground; ctx.fillRect(startX, GROUND_Y, endX - startX, VIEW_H - GROUND_Y + 60);
  ctx.strokeStyle = PAL.groundTop; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(startX, GROUND_Y); ctx.lineTo(endX, GROUND_Y); ctx.stroke();
}
function drawLevelElements(){
  for (const L of LEVELS){
    if (!L.scene) continue;
    const isCur = (currentLevel === L);
    const active = ['level_intro','ready','growing','fixed','transforming','fail'].includes(phase);
    L.scene(isCur && active ? getBlinkAlpha() : 0.35, isCur && active ? getBlinkAlpha() : 0.35);
  }
}
function drawRopeShape(){
  for (const s of completedShapes) s.level.renderShape(s.len, 1, 0, 1);
  if (!currentLevel) return;
  if (['intro','walking','level_intro','done','entering','fadeout'].includes(phase)) return;
  if (['ready','growing','fixed'].includes(phase)){ drawVerticalRope(currentLevel.handX, currentLevel.handY, ropeLen, 1); return; }
  if (phase === 'transforming'){
    const t = easeOutCubic(transformT);
    drawVerticalRope(currentLevel.handX, currentLevel.handY, ropeLen, 1 - t);
    if (currentLevel.id !== 'gap') currentLevel.renderShape(ropeLen * t, t, 0, null);
    else currentLevel.renderShape(ropeLen, 1, 0, t);
    return;
  }
  if (phase === 'success') return;
  if (phase === 'fail'){
    const ft = Math.min(phaseTimer / 0.7, 1);
    currentLevel.renderShape(ropeLen, 1 - ft * 0.9, ft * 55, 1);
    currentLevel.ghost();       // P2/P3：失败给相对信息（正确形状并排对比），不给数值
  }
}
function drawVerticalRope(x, y, len, alpha){   // V2：提对比 + 柔和投影 + 明确手持点（仅特效，几何不变）
  if (len <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = ROPE_SHADOW; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(x+2, y+2); ctx.lineTo(x+2, y-len+2); ctx.stroke();
  ctx.strokeStyle = ROPE_C; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y-len); ctx.stroke();
  ctx.strokeStyle = ROPE_H; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x-1.2, y); ctx.lineTo(x-1.2, y-len); ctx.stroke();
  ctx.fillStyle = ROPE_C; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();   // 手持点：明确生长原点
  ctx.restore();
}
function drawTiger(x, baseY, walkPhase, state){
  ctx.save(); ctx.translate(x, baseY);
  ctx.strokeStyle = '#e08a3c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(32,-28); ctx.quadraticCurveTo(52,-40,50,-16); ctx.stroke();
  ctx.fillStyle = '#e08a3c'; ctx.beginPath(); ctx.ellipse(0,-22,34,20,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c97a30';
  const sw = state === 'stalking' ? Math.sin(walkPhase)*4 : 0;
  ctx.fillRect(-24+sw,-8,8,20); ctx.fillRect(-10-sw,-8,8,20); ctx.fillRect(8+sw,-8,8,20); ctx.fillRect(20-sw,-8,8,20);
  ctx.fillStyle = '#e89a45'; ctx.beginPath(); ctx.arc(-36,-36,18,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-42,-52); ctx.lineTo(-48,-64); ctx.lineTo(-34,-52); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-28,-52); ctx.lineTo(-22,-62); ctx.lineTo(-20,-50); ctx.fill();
  ctx.strokeStyle = '#3a2818'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-12,-38); ctx.lineTo(-8,-32); ctx.moveTo(0,-40); ctx.lineTo(4,-32); ctx.moveTo(12,-38); ctx.lineTo(16,-30); ctx.stroke();
  ctx.fillStyle = '#3a2818';
  ctx.beginPath(); ctx.arc(-42,-38,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-30,-38,2.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3a2818'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-50,-32); ctx.lineTo(-58,-30); ctx.moveTo(-50,-34); ctx.lineTo(-58,-36); ctx.stroke();
  ctx.restore();
}
function drawRabbit(x, baseY, scared){
  ctx.save(); ctx.translate(x, baseY);
  const tr = scared ? Math.sin(performance.now()/70)*1.2 : 0;
  ctx.fillStyle = '#f0ece0';
  ctx.beginPath(); ctx.ellipse(0,-14+tr,14,12,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10,-22+tr,9,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8,-38+tr,3,9,-0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14,-38+tr,3,9,0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-13,-10+tr,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a2818'; ctx.beginPath(); ctx.arc(13,-23+tr,1.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#d98a8a'; ctx.beginPath(); ctx.arc(19,-20+tr,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawCharacter(){
  if (charAlpha <= 0) return;
  const x = charX;
  const walking = ['walking','intro','success','entering'].includes(phase);
  const bob = walking ? Math.abs(Math.sin(performance.now()/130))*3 : 0;
  const bodyY = GROUND_Y - 32 + bob;
  ctx.save(); ctx.globalAlpha = charAlpha; ctx.fillStyle = '#3a3a30';
  ctx.beginPath(); ctx.arc(x, bodyY-28, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(x-6, bodyY-18, 12, 26);
  const legSwing = walking ? Math.sin(performance.now()/130)*6 : 0;
  ctx.fillRect(x-7+legSwing, bodyY+8, 5, 26); ctx.fillRect(x+2-legSwing, bodyY+8, 5, 26);
  ctx.strokeStyle = '#3a3a30'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  if (currentLevel && ['ready','growing','fixed'].includes(phase)){ ctx.moveTo(x, bodyY-10); ctx.lineTo(currentLevel.handX, currentLevel.handY); }
  else { const armSwing = walking ? Math.sin(performance.now()/130)*6 : 2; ctx.moveTo(x, bodyY-10); ctx.lineTo(x+8, bodyY+10+armSwing); }
  ctx.stroke(); ctx.restore();
}
function drawLevelText(){
  if (!currentLevel || !currentLevel.introText) return;
  if (textTimer >= 3.0) return;
  const alpha = textTimer < 2.2 ? 1 : Math.max(0, (3.0 - textTimer)/0.8);
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = '600 28px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(currentLevel.introText).width, bx = VIEW_W/2, by = 96;
  ctx.fillStyle = 'rgba(255,255,255,0.82)'; ctx.fillRect(bx - tw/2 - 22, by - 26, tw + 44, 52);
  ctx.fillStyle = '#3a3a30'; ctx.fillText(currentLevel.introText, bx, by);
  ctx.restore();
}
function drawMessage(){
  if (!failMsg) return;
  ctx.save();
  ctx.fillStyle = 'rgba(55,50,40,0.88)';
  ctx.font = '600 26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.fillText(failMsg, VIEW_W/2, 160);
  ctx.restore();
}
function drawEnding(){
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y); g.addColorStop(0,'#cfe3f5'); g.addColorStop(1,'#e8f0e0');
  ctx.fillStyle = g; ctx.fillRect(0,0,VIEW_W,GROUND_Y);
  ctx.fillStyle = '#a8c890'; ctx.fillRect(0,GROUND_Y-20,VIEW_W,VIEW_H-GROUND_Y+20);
  ctx.fillStyle = '#6a8a60'; ctx.fillRect(0,GROUND_Y-170,180,150);
  for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(20+i*45, GROUND_Y-170, 26, 0, Math.PI*2); ctx.fill(); }
  const cx = VIEW_W/2 + 40, cy = GROUND_Y - 20;
  ctx.save(); ctx.fillStyle = '#3a3a30';
  ctx.beginPath(); ctx.arc(cx, cy-52, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(cx-6, cy-42, 12, 26); ctx.fillRect(cx-7, cy-16, 5, 16); ctx.fillRect(cx+2, cy-16, 5, 16);
  ctx.strokeStyle = '#3a3a30'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy-34); ctx.lineTo(cx+12, cy-22); ctx.stroke();
  ctx.strokeStyle = ROPE_C; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx+12, cy-22); ctx.quadraticCurveTo(cx+18, cy-14, cx+16, cy-6); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(60,60,50,0.88)';
  ctx.font = '600 28px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('走出森林了。', VIEW_W/2, 130);
  ctx.font = '400 18px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(60,60,50,0.65)'; ctx.fillText('点击屏幕重新开始', VIEW_W/2, 172);
}

// ===== 选关 / 数据面板（T10）=====
const panel = document.getElementById('panel');
function unlockedMax(){
  const p = loadProgress();
  return p ? Math.min(p.levelIndex, LEVELS.length - 1) : 0;
}
function openPanel(mode){
  panel.style.display = 'flex';
  const grid = document.getElementById('pGrid');
  grid.innerHTML = '';
  if (mode === 'levels'){
    document.getElementById('pTitle').textContent = '选关';
    document.getElementById('pSub').textContent = '已解锁的关卡（进度自动保存在本机）';
    const mx = unlockedMax();
    LEVELS.forEach((L, i) => {
      const b = document.createElement('button');
      b.className = 'lv'; b.disabled = i > mx;
      b.innerHTML = `<span class="t">${i+1}. ${L.name}</span><span class="c">${L.cls} · ${L.shape}</span>`;
      b.onclick = () => { panel.style.display = 'none'; resetGame(true); rebuildCompleted(i); startLevel(i); };
      grid.appendChild(b);
    });
  } else {
    document.getElementById('pTitle').textContent = 'Playtest 数据';
    document.getElementById('pSub').textContent = 'A/B/C 失败信号：连续3次失败 / 首关太易 / 终关劝退';
    const r = report();
    const box = document.createElement('div');
    box.style.cssText = 'font:12px/1.7 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#3a3a30';
    box.textContent = JSON.stringify(r, null, 2);
    grid.appendChild(box);
  }
}
document.getElementById('btnLevels').onclick = () => openPanel('levels');
document.getElementById('btnData').onclick = () => openPanel('data');
document.getElementById('pClose').onclick = () => { panel.style.display = 'none'; };
document.getElementById('pReset').onclick = () => { clearProgress(); panel.style.display = 'none'; resetGame(false); };

// ===== 调试探针（供回归脚本驱动，T1）=====
window.__dbg = {
  get phase(){ return phase; }, get levelIndex(){ return levelIndex; }, get ropeLen(){ return ropeLen; },
  get level(){ return currentLevel; }, get charX(){ return charX; },
  get levels(){ return LEVELS; }, get completed(){ return completedShapes.length; },
  get failMsg(){ return failMsg; }, get metrics(){ return metrics; }, report,
  jump(i){ resetGame(true); rebuildCompleted(i);
    charX = LEVELS[i].triggerX - 30; cameraX = Math.max(0, charX - 300); startLevel(i); },
  clearSave(){ clearProgress(); },
};

function loop(now){ update(now); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
